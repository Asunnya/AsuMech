# The study relay: receives the plugin's pull recordings (see README, "The built-in study server").
# Secrets come from recordings.env next to this file (gitignored); copy recordings.env.example.
# The port is published on loopback only: the internet reaches it through the Funnel or your
# reverse proxy, never directly.
services:
  relay:
    build:
      context: ..
      dockerfile: AnoMech.Relay.Host/Dockerfile
    container_name: asumech-relay
    restart: unless-stopped
    env_file: recordings.env
    # The image's own user can't write a bind mount owned by you; run as you instead. On Docker
    # Desktop (Windows, macOS) the mount ignores this and either value works.
    user: "${RELAY_UID:-1000}:${RELAY_GID:-1000}"
    ports:
      - "127.0.0.1:7890:7890"
    volumes:
      - ./recordings:/recordings
    # The proxy on the host reaches the container from Docker's bridge gateway (172.16/12), not
    # from 127.0.0.1, so that whole private range is what the relay trusts to say "https".
    # Console logging only: `docker logs asumech-relay` has it, and the image has no writable
    # log folder.
    command: >
      --no-file-log
      --recordings-dir /recordings
      --trusted-proxy 172.16.0.0/12
      --trusted-proxy 127.0.0.1/32
